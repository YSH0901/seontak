<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택과목 & 학과 정보 정리 사이트</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 공통 뷰 컨트롤 */
        .view {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .view.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 검색 화면 */
        #search-view {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .search-container {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }

        .search-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--primary);
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-btn:hover {
            background: #1d4ed8;
        }

        .search-hint {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 상세 화면 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--bg-color);
        }

        .header-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .major-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .major-desc {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
        }

        /* 카드 공통 스타일 */
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
        }

        /* 태그 스타일 (선택과목 등) */
        .tag-group {
            margin-bottom: 20px;
        }
        
        .tag-group:last-child {
            margin-bottom: 0;
        }

        .tag-title {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .tag-content {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-main);
            word-break: keep-all;
        }

        /* 리스트 스타일 (도서, 팁, 직업 등) */
        .styled-list {
            list-style: none;
        }

        .styled-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            font-size: 15px;
            color: var(--text-main);
        }

        .styled-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
            font-size: 18px;
            line-height: 1.4;
        }

        /* 배지 스타일 (자격증 등) */
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: #f1f5f9;
            color: #475569;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* 교과목 테이블 스타일 */
        .subject-table {
            width: 100%;
            border-collapse: collapse;
        }

        .subject-table th, .subject-table td {
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
        }

        .subject-table th {
            background-color: var(--bg-color);
            font-weight: 600;
            width: 90px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
            .search-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- 검색 화면 -->
    <div id="search-view" class="view active">
        <div class="search-container">
            <div class="search-title">🎓 대학 전공 & 선택과목 검색</div>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="예: 기계공학과, 건축학과" onkeypress="if(event.keyCode==13) searchMajor()">
                <button class="search-btn" onclick="searchMajor()">검색</button>
            </div>
            <div class="search-hint">현재 등록된 학과: 기계공학과, 건축공학과, 건축학과</div>
        </div>
    </div>

    <!-- 상세 화면 -->
    <div id="detail-view" class="view">
        <div class="container">
            <button class="back-btn" onclick="showSearch()">← 검색 화면으로</button>
            
            <!-- 상단 헤더: 학과명 및 소개 -->
            <div class="header-card">
                <div class="major-title" id="majorTitle">학과명</div>
                <div class="major-desc" id="majorDesc">학과 설명이 이곳에 표시됩니다.</div>
            </div>

            <!-- 하단 정보 그리드 -->
            <div class="grid-layout">
                
                <!-- 1. 선택 과목 -->
                <div class="card">
                    <div class="card-title">📚 학과 관련 선택 과목</div>
                    <div id="majorElectives"></div>
                </div>

                <!-- 2. 학과 주요 교과목 -->
                <div class="card">
                    <div class="card-title">📖 학과 주요 교과목</div>
                    <table class="subject-table">
                        <tbody>
                            <tr>
                                <th>기초 과목</th>
                                <td id="basicSubjects"></td>
                            </tr>
                            <tr>
                                <th>심화 과목</th>
                                <td id="advancedSubjects"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 3. 추천 도서 -->
                <div class="card">
                    <div class="card-title">📗 추천 도서 목록</div>
                    <div class="badge-container" id="majorBooks"></div>
                </div>

                <!-- 4. 취득가능 자격증 -->
                <div class="card">
                    <div class="card-title">🏅 취득가능 자격증</div>
                    <div class="badge-container" id="majorCerts"></div>
                </div>

                <!-- 5. 학교생활 팁 -->
                <div class="card">
                    <div class="card-title">💡 학교생활 TIPS</div>
                    <ul class="styled-list" id="majorTips"></ul>
                </div>

                <!-- 6. 졸업 후 진출 직업 -->
                <div class="card">
                    <div class="card-title">💼 졸업 후 진출 직업</div>
                    <ul class="styled-list" id="majorJobs"></ul>
                </div>

                <!-- 7. 개설 대학 -->
                <div class="card">
                    <div class="card-title">🏫 주요 개설 대학</div>
                    <div class="tag-group">
                        <div class="tag-title" style="background:#f1f5f9; color:#475569;">서울/수도권 및 기타 주요 대학</div>
                        <div class="tag-content" id="majorUnivs"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

        // 검색 기능
        function searchMajor() {
            const input = document.getElementById('searchInput').value.trim();
            if (!input) {
                alert("학과 이름을 입력해주세요! (예: 기계공학과)");
                return;
            }

            // 정확히 일치하거나 포함되는 학과 찾기
            let foundKey = null;
            for (let key in majorData) {
                if (key.includes(input)) {
                    foundKey = key;
                    break;
                }
            }

            if (foundKey) {
                renderDetail(majorData[foundKey]);
                document.getElementById('search-view').classList.remove('active');
                document.getElementById('detail-view').classList.add('active');
            } else {
                alert("해당 학과 정보가 없습니다. '기계공학과', '건축공학과', '건축학과' 중 하나를 검색해보세요.");
            }
        }

        // 화면 뒤로가기
        function showSearch() {
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('search-view').classList.add('active');
            document.getElementById('searchInput').value = '';
        }

        // 상세 정보 화면에 데이터 뿌리기
        function renderDetail(data) {
            document.getElementById('majorTitle').innerText = data.title;
            document.getElementById('majorDesc').innerText = data.desc;

            // 1. 선택과목 렌더링
            const electivesHTML = data.electives.map(item => `
                <div class="tag-group">
                    <div class="tag-title">${item.type}</div>
                    <div class="tag-content">${item.subjects}</div>
                </div>
            `).join('');
            document.getElementById('majorElectives').innerHTML = electivesHTML;

            // 2. 주요 교과목
            document.getElementById('basicSubjects').innerText = data.basicSubjects;
            document.getElementById('advancedSubjects').innerText = data.advancedSubjects;

            // 3. 추천 도서 (배지 형태)
            document.getElementById('majorBooks').innerHTML = data.books.map(book => 
                `<span class="badge" style="background:#f3f4f6; border:1px solid #e5e7eb;">📘 ${book}</span>`
            ).join('');

            // 4. 자격증 (배지 형태)
            document.getElementById('majorCerts').innerHTML = data.certs.map(cert => 
                `<span class="badge" style="background:#ecfeff; color:#0e7490; border:1px solid #a5f3fc;">${cert}</span>`
            ).join('');

            // 5. 팁 (리스트 형태)
            document.getElementById('majorTips').innerHTML = data.tips.map(tip => 
                `<li>${tip}</li>`
            ).join('');

            // 6. 진출 직업 (리스트 형태)
            document.getElementById('majorJobs').innerHTML = data.jobs.map(job => 
                `<li>${job}</li>`
            ).join('');

            // 7. 개설 대학
            document.getElementById('majorUnivs').innerText = data.univs;
        }
