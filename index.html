<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택과목 가이드</title>
    <!-- 깔끔한 웹폰트 (Pretendard) 적용 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 0.5s ease-out;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }
        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px 24px;
            font-size: 1.15rem;
            border: 2px solid var(--border);
            border-radius: 99px;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
            background: var(--surface);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-top: 8px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            display: none;
            z-index: 10;
            overflow: hidden;
            text-align: left;
        }
        .suggestion-item {
            padding: 16px 24px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.15s;
        }
        .suggestion-item:hover {
            background: var(--bg);
            color: var(--primary);
            font-weight: 500;
        }
        .quick-tags {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tag {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 99px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #eff6ff;
        }
        
        /* Detail View Styles */
        #detail-view {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 32px;
            transition: color 0.2s;
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .back-btn:hover {
            color: var(--text-main);
            background: var(--bg);
        }
        .major-header {
            margin-bottom: 48px;
            background: var(--surface);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
        }
        .major-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 16px 0;
            color: var(--primary);
        }
        .major-desc {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.7;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 24px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--bg);
        }
        .list {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 14px;
            color: #334155;
        }
        .list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1.4;
        }
        .list li:last-child {
            margin-bottom: 0;
        }
        .badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary);
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 초기 검색 화면 -->
        <div id="home-view">
            <header>
                <h1>목표 학과를 검색해보세요</h1>
                <p style="color: var(--text-muted); font-size: 1.15rem; margin-bottom: 48px;">
                    해당 학과의 권장 선택과목, 진로, 학교생활 팁을 한눈에 확인하실 수 있습니다.
                </p>
                
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="예: 기계공학과, 건축학과..." autocomplete="off">
                    <div class="suggestions" id="suggestions"></div>
                    
                    <div class="quick-tags">
                        <div class="tag" onclick="showDetail('기계공학과')">#기계공학과</div>
                        <div class="tag" onclick="showDetail('건축공학과')">#건축공학과</div>
                        <div class="tag" onclick="showDetail('건축학과')">#건축학과</div>
                    </div>
                </div>
            </header>
        </div>

        <!-- 학과 상세 정보 화면 -->
        <div id="detail-view">
            <div class="back-btn" onclick="showHome()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                검색 화면으로
            </div>
            
            <div class="major-header">
                <h2 class="major-title" id="m-title">학과명</h2>
                <p class="major-desc" id="m-desc">학과 설명이 들어갑니다.</p>
            </div>

            <div class="grid">
                <div class="card">
                    <h3 class="card-title">📚 학과 관련 선택 과목</h3>
                    <div id="m-subjects"></div>
                </div>
                
                <div class="card">
                    <h3 class="card-title">🎯 졸업 후 진출 분야</h3>
                    <ul class="list" id="m-careers"></ul>
                </div>
                
                <div class="card">
                    <h3 class="card-title">💡 학교생활 TIPS</h3>
                    <ul class="list" id="m-tips"></ul>
                </div>

                <div class="card">
                    <h3 class="card-title">🎓 주요 개설 대학</h3>
                    <p id="m-unis" style="color: #334155; line-height: 1.8;"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 추출한 학과별 데이터 베이스
        const majorData = {
            "기계공학과": {
                desc: "힘과 운동에 관한 자연 현상을 이해하고, 인간 생활에 유용한 기계제품을 설계하며 생산하는 과정을 연구하는 학문입니다. 자동차, 항공우주, 인공 장기, 나노 기술 등 첨단 기술 산업을 이끌어갈 인재를 양성합니다.",
                subjects: [
                    { type: "일반 선택 (수학/과학)", items: "수학Ⅰ, 수학Ⅱ, 미적분, 확률과 통계, 물리학Ⅰ, 화학Ⅰ" },
                    { type: "진로 선택", items: "기하, 물리학Ⅱ, 화학Ⅱ, 공학 일반 등" },
                    { type: "교양 및 기타", items: "기술·가정, 정보, 환경" }
                ],
                careers: ["기계공학 기술자", "3D 프린터 개발자", "항공우주 연구원", "자동차공학 기술자", "로봇공학자", "플랜트공학 기술자", "냉난방 및 공조공학 기술자"],
                unis: "강원대, 경희대, 고려대, 국민대, 단국대, 동아대, 부산대, 서울과기대, 서울대, 성균관대, 연세대, 인하대, 한양대 등 주요 종합대학",
                tips: [
                    "기계공학의 기본이 되는 수학, 과학(물리학) 교과의 높은 학업 성취도를 유지하는 것이 핵심입니다.",
                    "발명, 코딩(아두이노 등), 과학 탐구 실험 동아리 활동을 통해 구체적인 문제 해결 및 산출물 제작 경험을 쌓으세요.",
                    "자동차, 전자, 전기 등 다양한 분야에 호기심을 가지고 탐구하는 태도를 보여주는 것이 좋습니다."
                ]
            },
            "건축공학과": {
                desc: "인간 생활을 영위하는 공간 창조를 위한 학문으로, 건축물을 보다 안전하고 경제적이며 편리하게 구현하도록 교육합니다. 건축구조, 재료, 시공, 건설관리 등에 관한 공학적 이론과 기술을 다룹니다.",
                subjects: [
                    { type: "일반 선택 (수학/과학)", items: "수학Ⅰ, 수학Ⅱ, 미적분, 확률과 통계, 물리학Ⅰ, 화학Ⅰ, 지구과학Ⅰ" },
                    { type: "진로 선택", items: "기하, 물리학Ⅱ, 화학Ⅱ, 공간 좌표 등" },
                    { type: "교양 및 기타", items: "환경, 실용 수학, 지식 재산 일반" }
                ],
                careers: ["건축공학 기술자", "건축구조 기술자", "건축시공 기술자", "건설공사 품질관리원", "녹색건축 전문가", "안전 기술자", "국가직 및 지방직 공무원(건축)"],
                unis: "건국대, 경희대, 고려대, 광운대, 부산대, 서울과기대, 서울대, 서울시립대, 성균관대, 연세대, 충남대, 한양대 등",
                tips: [
                    "수학, 물리학 등 기초 공학 과목에 대한 높은 이해도와 공간 지각력이 필요합니다.",
                    "건설 현장 탐방, 건축 박람회 참관 등 실질적인 직업 탐색 활동을 추천합니다.",
                    "안전 문제나 지속가능한 친환경 건축에 대한 관심을 학교 활동에 녹여내면 긍정적입니다."
                ]
            },
            "건축학과": {
                desc: "건축과 도시 공간에 대한 기획부터 설계, 비평에 이르는 광범위한 학문입니다. 공학적 소양뿐만 아니라 미학, 철학, 심리학 등 인문학적 소양을 종합적으로 바탕으로 건물을 디자인합니다. (보통 5년제 운영)",
                subjects: [
                    { type: "일반 선택 (수학/과학)", items: "수학Ⅰ, 수학Ⅱ, 미적분, 기하, 물리학Ⅰ, 물리학Ⅱ" },
                    { type: "일반 선택 (사회/예술)", items: "세계사, 세계지리, 사회·문화, 미술 창작" },
                    { type: "진로 선택", items: "미술 감상과 비평, 사회문제 탐구 등" }
                ],
                careers: ["건축사(보)", "건축설계 기술자", "인테리어 디자이너", "도시계획 및 설계자", "녹색건축 전문가", "BIM 디자이너", "문화재 보존원"],
                unis: "건국대, 경희대, 고려대, 국민대, 동국대, 서울대, 서울시립대, 성균관대, 연세대, 이화여대, 한양대, 홍익대 등",
                tips: [
                    "공학적 기초와 더불어 예술적 감각(미술)과 인문학적 소양(역사, 지리)이 복합적으로 요구됩니다.",
                    "건축물 스케치, 3D 모델링 경험이나 유명 건축가에 대한 탐구 활동을 추천합니다.",
                    "협업 프로젝트를 통해 리더십과 의사소통 능력을 발휘한 경험이 생기부에 드러나면 좋습니다."
                ]
            }
        };

        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        const homeView = document.getElementById('home-view');
        const detailView = document.getElementById('detail-view');

        // 검색창 실시간 반응 로직
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim().replace(/\s+/g, ""); // 공백 제거 후 검색
            if (!val) {
                suggestionsBox.style.display = 'none';
                return;
            }

            // 입력값을 포함하는 학과명 필터링
            const matches = Object.keys(majorData).filter(major => major.includes(val));
            
            if (matches.length > 0) {
                suggestionsBox.innerHTML = matches.map(major => 
                    `<div class="suggestion-item" onclick="showDetail('${major}')">🔍 <b>${major}</b></div>`
                ).join('');
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        });

        // 빈 공간 클릭 시 추천 검색어 숨김
        document.addEventListener('click', (e) => {
            if (e.target !== searchInput) {
                suggestionsBox.style.display = 'none';
            }
        });

        // 상세 페이지 렌더링 함수
        function showDetail(majorName) {
            const data = majorData[majorName];
            if (!data) return;

            // 데이터 채우기
            document.getElementById('m-title').innerText = majorName;
            document.getElementById('m-desc').innerText = data.desc;
            
            document.getElementById('m-subjects').innerHTML = data.subjects.map(sub => 
                `<div style="margin-bottom: 20px;">
                    <div class="badge">${sub.type}</div>
                    <div style="padding-left: 4px; color: #334155;">${sub.items}</div>
                </div>`
            ).join('');

            document.getElementById('m-careers').innerHTML = data.careers.map(c => `<li>${c}</li>`).join('');
            document.getElementById('m-unis').innerText = data.unis;
            document.getElementById('m-tips').innerHTML = data.tips.map(t => `<li>${t}</li>`).join('');

            // 화면 전환
            homeView.style.display = 'none';
            detailView.style.display = 'block';
            
            // 검색창 초기화
            searchInput.value = '';
            suggestionsBox.style.display = 'none';
            
            // 스크롤 맨 위로
            window.scrollTo(0, 0);
        }

        // 홈 화면으로 돌아가기
        function showHome() {
            detailView.style.display = 'none';
            homeView.style.display = 'block';
        }
    </script>
</body>
</html>
