<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택과목 & 학과 정보 정리 사이트</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 뷰 전환 */
        .view {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .view.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 검색 화면 */
        #search-view {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .search-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            max-width: 520px;
            width: 100%;
            position: relative;
        }

        .search-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--primary);
            text-align: center;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #1d4ed8;
        }

        /* 연관 검색어 (자동완성) 드롭다운 */
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .autocomplete-dropdown.show {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--bg-color);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .quick-tags {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-tag {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* 상세 화면 레이아웃 (이전 스타일 유지) */
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #f1f5f9;
        }

        .header-card {
            background: var(--card-bg);
            padding: 36px;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .major-title {
            font-size: 30px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .major-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 선택 과목 전용 세분화 스타일 */
        .elective-box {
            margin-bottom: 16px;
        }

        .elective-box:last-child {
            margin-bottom: 0;
        }

        .elective-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .elective-text {
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 불렛 리스트 */
        .bullet-list {
            list-style: none;
        }

        .bullet-list li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.6;
        }

        .bullet-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        /* 배지 컨테이너 (도서, 자격증) */
        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: #f1f5f9;
            color: #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        /* 주요 교과목 표 */
        .subject-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .subject-table th, .subject-table td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: left;
        }

        .subject-table th {
            background-color: var(--bg-color);
            width: 80px;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 868px) {
            .grid-layout { grid-template-columns: 1fr; }
            .search-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- 1. 검색 화면 -->
    <div id="search-view" class="view active">
        <div class="search-container">
            <div class="search-title">선택과목 & 학과 정보 검색</div>
            
            <div class="search-box-wrapper">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="학과명을 입력하세요 (예: 기계, 건축)" autocomplete="off">
                    <button class="search-btn" onclick="executeSearch()">검색</button>
                </div>
                <!-- 연관 검색어 드롭다운 -->
                <div id="autocompleteList" class="autocomplete-dropdown"></div>
            </div>

            <!-- 빠른 선택 태그 -->
            <div class="quick-tags">
                <span class="quick-tag" onclick="selectMajor('기계공학과')">#기계공학과</span>
                <span class="quick-tag" onclick="selectMajor('건축공학과')">#건축공학과</span>
                <span class="quick-tag" onclick="selectMajor('건축학과')">#건축학과</span>
            </div>
        </div>
    </div>

    <!-- 2. 상세 화면 -->
    <div id="detail-view" class="view">
        <div class="container">
            <button class="back-btn" onclick="showSearch()">← 검색 화면으로</button>
            
            <!-- 헤더 카드 -->
            <div class="header-card">
                <div class="major-title" id="majorTitle">학과명</div>
                <div class="major-desc" id="majorDesc">학과 설명이 들어갑니다.</div>
            </div>

            <!-- 카드 그리드 -->
            <div class="grid-layout">
                
                <!-- 선택 과목 -->
                <div class="card">
                    <div class="card-title">📚 학과 관련 선택 과목</div>
                    <div id="majorElectives"></div>
                </div>

                <!-- 졸업 후 진출 분야 -->
                <div class="card">
                    <div class="card-title">🎯 졸업 후 진출 분야</div>
                    <ul class="bullet-list" id="majorJobs"></ul>
                </div>

                <!-- 학과 주요 교과목 -->
                <div class="card">
                    <div class="card-title">📖 학과 주요 교과목</div>
                    <table class="subject-table">
                        <tbody>
                            <tr>
                                <th>기초 과목</th>
                                <td id="basicSubjects"></td>
                            </tr>
                            <tr>
                                <th>심화 과목</th>
                                <td id="advancedSubjects"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 취득가능 자격증 -->
                <div class="card">
                    <div class="card-title">🏅 취득가능 자격증</div>
                    <div class="badge-list" id="majorCerts"></div>
                </div>

                <!-- 추천 도서 목록 -->
                <div class="card" style="grid-column: span 1;">
                    <div class="card-title">📗 추천 도서 목록</div>
                    <div class="badge-list" id="majorBooks"></div>
                </div>

                <!-- 개설 대학 -->
                <div class="card">
                    <div class="card-title">🏫 주요 개설 대학</div>
                    <div class="elective-text" id="majorUnivs"></div>
                </div>

                <!-- 학교생활 TIPS -->
                <div class="card" style="grid-column: 1 / -1;">
                    <div class="card-title">💡 학교생활 TIPS</div>
                    <ul class="bullet-list" id="majorTips"></ul>
                </div>

            </div>
        </div>
    </div>

        // 검색창 실시간 연관검색어 이벤트
        const searchInput = document.getElementById('searchInput');
        const autocompleteList = document.getElementById('autocompleteList');

        searchInput.addEventListener('input', function() {
            const val = this.value.trim().toLowerCase();
            autocompleteList.innerHTML = '';

            if (!val) {
                autocompleteList.classList.remove('show');
                return;
            }

            // 매칭되는 학과 검색
            const matches = Object.keys(majorData).filter(key => key.toLowerCase().includes(val));

            if (matches.length > 0) {
                matches.forEach(match => {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.innerHTML = `<span>${match}</span><span style="font-size:12px; color:var(--text-muted)">이동 →</span>`;
                    item.onclick = function() {
                        selectMajor(match);
                        autocompleteList.classList.remove('show');
                    };
                    autocompleteList.appendChild(item);
                });
                autocompleteList.classList.add('show');
            } else {
                autocompleteList.classList.remove('show');
            }
        });

        // 엔터키 또는 버튼으로 검색 실행
        function executeSearch() {
            const val = searchInput.value.trim();
            if (!val) {
                alert("학과명을 입력하세요.");
                return;
            }

            let found = Object.keys(majorData).find(key => key.includes(val));
            if (found) {
                selectMajor(found);
                autocompleteList.classList.remove('show');
            } else {
                alert("검색 결과가 없습니다. '기계', '건축' 등으로 검색해 보세요.");
            }
        }

        // 학과 선택 시 상세화면 전환
        function selectMajor(majorName) {
            const data = majorData[majorName];
            if (!data) return;

            document.getElementById('majorTitle').innerText = data.title;
            document.getElementById('majorDesc').innerText = data.desc;

            // 선택 과목
            document.getElementById('majorElectives').innerHTML = data.electives.map(item => `
                <div class="elective-box">
                    <span class="elective-badge">${item.type}</span>
                    <div class="elective-text">${item.subjects}</div>
                </div>
            `).join('');

            // 진출 분야 / 직업
            document.getElementById('majorJobs').innerHTML = data.jobs.map(job => `<li>${job}</li>`).join('');

            // 주요 교과목
            document.getElementById('basicSubjects').innerText = data.basicSubjects;
            document.getElementById('advancedSubjects').innerText = data.advancedSubjects;

            // 자격증
            document.getElementById('majorCerts').innerHTML = data.certs.map(cert => `<span class="chip">${cert}</span>`).join('');

            // 추천 도서
            document.getElementById('majorBooks').innerHTML = data.books.map(book => `<span class="chip">📘 ${book}</span>`).join('');

            // 개설 대학
            document.getElementById('majorUnivs').innerText = data.univs;

            // 학교생활 팁
            document.getElementById('majorTips').innerHTML = data.tips.map(tip => `<li>${tip}</li>`).join('');

            // 뷰 전환
            document.getElementById('search-view').classList.remove('active');
            document.getElementById('detail-view').classList.add('active');
            window.scrollTo(0, 0);
        }

        // 검색 화면으로 돌아가기
        function showSearch() {
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('search-view').classList.add('active');
            searchInput.value = '';
            autocompleteList.classList.remove('show');
        }

        // 외부 클릭시 연관검색어 닫기
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box-wrapper')) {
                autocompleteList.classList.remove('show');
            }
        });
    </script>
</body>
</html>
