<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택과목 & 학과 정보 정리 사이트</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 뷰 전환 */
        .view {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .view.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 검색 화면 */
        #search-view {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .search-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            max-width: 520px;
            width: 100%;
            position: relative;
        }

        .search-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--primary);
            text-align: center;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #1d4ed8;
        }

        /* 연관 검색어 드롭다운 */
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .autocomplete-dropdown.show {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--bg-color);
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .quick-tags {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-tag {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* 상세 화면 레이아웃 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #f1f5f9;
        }

        .header-card {
            background: var(--card-bg);
            padding: 36px;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .major-title {
            font-size: 30px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .major-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .elective-box {
            margin-bottom: 16px;
        }

        .elective-box:last-child {
            margin-bottom: 0;
        }

        .elective-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .elective-text {
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.6;
        }

        .bullet-list {
            list-style: none;
        }

        .bullet-list li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.6;
        }

        .bullet-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: #f1f5f9;
            color: #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .subject-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .subject-table th, .subject-table td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: left;
        }

        .subject-table th {
            background-color: var(--bg-color);
            width: 80px;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 868px) {
            .grid-layout { grid-template-columns: 1fr; }
            .search-container { padding: 30px 20px; }
        }

        /* 선택과목 결과 */
        #subject-results {
            display: none;
            padding: 20px;
        }
        #subject-results.active { display: block; }
        .subject-result-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            margin: 0 auto 24px;
            max-width: 1100px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }
        .subject-result-title {
            padding: 24px 28px;
            background: var(--primary-light);
            border-bottom: 1px solid var(--border-color);
        }
        .subject-result-title .group {
            font-size: 13px; color: var(--primary); font-weight: 700; margin-bottom: 4px;
        }
        .subject-result-title h2 { font-size: 24px; margin: 0; }
        .subject-table-full { width: 100%; border-collapse: collapse; font-size: 14px; }
        .subject-table-full th, .subject-table-full td {
            border: 1px solid var(--border-color); padding: 14px 16px; vertical-align: top; text-align: left; line-height: 1.7;
        }
        .subject-table-full th { background: var(--bg-color); width: 140px; text-align: center; font-weight: 700; color: var(--text-main); }
        .subject-table-full ul { padding-left: 20px; margin: 0; }
        .result-note { max-width: 1100px; margin: 0 auto 16px; color: var(--text-muted); font-size: 14px; }
        .mode-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
        .mode-tab {
            border: 1px solid var(--border-color); background: white; color: var(--text-muted);
            padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .mode-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .mode-tab:hover { border-color: var(--primary); color: var(--primary); }
        .mode-tab.active:hover { color: white; }
        @media (max-width: 680px) {
            .subject-table-full th { width: 100px; }
            .subject-result-title h2 { font-size: 20px; }
            #subject-results { padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- 1. 검색 화면 -->
    <div id="search-view" class="view active">
        <div class="search-container">
            <div class="search-title" id="search-title">선택과목 & 학과 정보 검색</div>

            <div class="mode-tabs">
                <button class="mode-tab active" id="mode-major" onclick="switchMode('major')">학과별 정보</button>
                <button class="mode-tab" id="mode-subject" onclick="switchMode('subject')">선택과목 정보</button>
            </div>
            
            <div class="search-box-wrapper">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="학과명을 입력하세요 (예: 기계, 컴퓨터)" autocomplete="off">
                    <button class="search-btn" onclick="executeSearch()">검색</button>
                </div>
                <div id="autocompleteList" class="autocomplete-dropdown"></div>
            </div>

            <!-- 빠른 선택 태그 -->
            <div class="quick-tags" id="quick-tags">
                <span class="quick-tag" onclick="selectMajor('기계공학과')">#기계공학과</span>
                <span class="quick-tag" onclick="selectMajor('건축공학과')">#건축공학과</span>
                <span class="quick-tag" onclick="selectMajor('건축학과')">#건축학과</span>
                <span class="quick-tag" onclick="selectMajor('컴퓨터공학과')">#컴퓨터공학과</span>
                <span class="quick-tag" onclick="selectMajor('전자공학과')">#전자공학과</span>
                <span class="quick-tag" onclick="selectMajor('화학공학과')">#화학공학과</span>
                <span class="quick-tag" onclick="selectMajor('신소재공학과')">#신소재공학과</span>
            </div>
        </div>
    </div>

    <!-- 선택과목 검색 결과 -->
    <div id="subject-results">
        <div class="result-note" id="subject-result-note"></div>
        <div id="subject-result-list"></div>
    </div>

    <!-- 2. 상세 화면 -->
    <div id="detail-view" class="view">
        <div class="container">
            <button class="back-btn" onclick="showSearch()">← 검색 화면으로</button>
            
            <!-- 헤더 카드 -->
            <div class="header-card">
                <div class="major-title" id="majorTitle">학과명</div>
                <div class="major-desc" id="majorDesc">학과 설명이 들어갑니다.</div>
            </div>

            <!-- 카드 그리드 -->
            <div class="grid-layout">
                
                <!-- 선택 과목 -->
                <div class="card">
                    <div class="card-title">📚 학과 관련 선택 과목</div>
                    <div id="majorElectives"></div>
                </div>

                <!-- 졸업 후 진출 분야 -->
                <div class="card">
                    <div class="card-title">🎯 졸업 후 진출 분야</div>
                    <ul class="bullet-list" id="majorJobs"></ul>
                </div>

                <!-- 학과 주요 교과목 -->
                <div class="card">
                    <div class="card-title">📖 학과 주요 교과목</div>
                    <table class="subject-table">
                        <tbody>
                            <tr>
                                <th>기초 과목</th>
                                <td id="basicSubjects"></td>
                            </tr>
                            <tr>
                                <th>심화 과목</th>
                                <td id="advancedSubjects"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 취득가능 자격증 -->
                <div class="card">
                    <div class="card-title">🏅 취득가능 자격증</div>
                    <div class="badge-list" id="majorCerts"></div>
                </div>

                <!-- 추천 도서 목록 -->
                <div class="card" style="grid-column: span 1;">
                    <div class="card-title">📗 추천 도서 목록</div>
                    <div class="badge-list" id="majorBooks"></div>
                </div>

                <!-- 개설 대학 -->
                <div class="card">
                    <div class="card-title">🏫 주요 개설 대학</div>
                    <div class="elective-text" id="majorUnivs"></div>
                </div>

                <!-- 학교생활 TIPS -->
                <div class="card" style="grid-column: 1 / -1;">
                    <div class="card-title">💡 학교생활 TIPS</div>
                    <ul class="bullet-list" id="majorTips"></ul>
                </div>

            </div>
        </div>
    </div>

<script>
        let currentMode = 'major';

        const majorData = {
            "기계공학과": {
                title: "기계공학과",
                desc: "힘과 운동에 관한 자연 현상을 이론 및 실험적인 방법으로 이해하고 인간 생활에 유용한 기계제품을 설계하며 생산하는 과정을 연구하는 학문입니다. 자동차, 초고속 열차, 인공위성, 에너지, 로봇, 인공 장기, 나노 기술 등 미래의 첨단 기술 산업을 창의적으로 이끌어갈 인재를 양성합니다.",
                electives: [
                    { type: "일반 선택", subjects: "화법과 작문, 독서, 언어와 매체, 문학, 대수, 미적분 I, 확률과 통계, 영어 회화, 영어 I, 영어 독해와 작문, 영어 II, 물리학, 화학, 기술·가정, 정보" },
                    { type: "진로 선택", subjects: "기하, 미적분 II, 인공지능 수학, 역학과 에너지, 전자기와 양자, 물질과 에너지, 화학 반응의 세계, 로봇과 공학세계, 인공지능 기초" },
                    { type: "융합 선택", subjects: "수학과제 탐구, 융합과학 탐구, 창의 공학 설계, 지식 재산 일반" }
                ],
                basicSubjects: "기초공학설계, 물리학 및 실험, 미적분학, 일반생물학, 일반화학, 공학수학 I, 동역학, 열역학, 고체역학, 기계재료, 기초전기전자 실험 등",
                advancedSubjects: "계측공학, 공학프로그래밍입문, 기계공학 종합설계, 기계공학프로젝트, 기계설계학, 기계진동, 나노재료와 응용, 내연기관, 로봇공학, 메카트로닉스, 생체공학, 수치해석, 실험통계학, 열에너지시스템, 자동제어, 전기전자회로, 지능형생산공학 등",
                books: ["알기 쉬운 기계공학 기초", "뉴턴의 법칙에서 아인슈타인의 상대론까지", "과학은 이것을 상상력이라고 한다", "한눈에 보는 과학자 트리", "10대에게 권하는 공학", "10대에게 권하는 물리학", "공학자의 세상 보는 눈", "나사의 별", "모든 움직이는 것들의 과학", "아주 위험한 과학책", "우주탐사의 물리학", "처음 읽는 인공위성 원격탐사 이야기", "클래식 파인만", "창의력에 미쳐라", "우주미션 이야기", "미래의 물리학", "뉴턴과 아인슈타인", "현대창의공학", "세상을 뒤흔든 특허전쟁 승자는 누구인가", "미적분으로 바라본 하루"],
                certs: ["일반기계기사", "기계설계산업기사", "기계설계기사", "메카트로닉스기사", "정밀측정산업기사", "컴퓨터응용가공산업기사", "기계기술사", "산업기계설비기술사", "생산자동화산업기사", "그린전동자동차기사", "철도차량산업기사", "철도차량기사", "건설기계설비기사", "공조냉동기계기사", "자동차 정비 기사", "중등학교 정교사 2급(기계)"],

                depts: "문예창작과, 국어국문학과, 국어교육학과, 영어영문학과, 불어불문학과, 독어독문학과, 노어노문학과, 중어중문학과, 일어일문학과, 통번역학과, 언어학과, 신문방송학과, 미디어커뮤니케이션학과, 문헌정보학과 등",
                jobs: "시인, 소설가, 극작가, 방송작가, 영화 시나리오 작가, 평론가, 인문사회 계열 교수, 언론인, 중등교사, 언어학연구원, 출판물편집자, 카피라이터, 프로듀서, 통역사 등",
                etc: "국어'의 심화된 내용을 다루고 있으므로, '국어'를 배운 후 학습하는 것을 권장함."
            },
            {
                group: "국어", name: "화법과 작문", type: "일반선택",
                desc: "국어'의 듣기·말하기 영역과 쓰기 영역을 심화·확장한 과목으로, 다양한 주제와 유형의 담화와 글을 바탕으로 의미를 구성하고 공유함으로써 능동적이고 효과적으로 소통하는 능력과 바람직한 의사소통 태도를 함양하는 데 목적을 두고 있음. 이 과목의 학습을 통해 말과 글을 주고받는 행위의 본질과 원리, 효과적인 내용의 구성과 표현, 공감과 배려의 정신이 갖는 가치 등을 종합적으로 이해할 수 있음.",
                contents: ["화법과 작문의 본질 (자아 인식, 대인 관계, 사회적 상호 작용)", "화법의 원리와 실제 (화법의 구성 요소, 담화의 맥락, 담화의 유형, 화법의 전략, 화법의 표현과 전달 방법)", "작문의 원리와 실제 (작문의 구성 요소, 작문의 맥락, 글의 유형, 작문의 전략, 작문의 표현과 전달 방법)", "화법과 작문의 태도 (배려·공감, 진정성·책임감)"],
                csat: "수능 국어 출제 과목임",
                depts: "국어국문학과, 국어교육학과, 통번역학과, 광고홍보학과, 신문방송학과, 미디어커뮤니케이션학과, 언어학과, 문예창작과, 문헌정보학과 등",
                jobs: "언론인, 인문사회계열 교수, 중등교사, 작가, 언어학연구원, 방송작가, 소설가, 시인, 영화시나리오 작가, 상담 전문가, 출판물편집자, 카피라이터, 평론가, 프로듀서, 통역사 등",
                etc: "국어'의 심화된 내용을 다루고 있으므로, '국어'를 배운 후 학습하는 것을 권장함."
            },
            {
                group: "국어", name: "실용 국어", type: "진로선택",
                desc: "국어'에서 학습한 결과를 바탕으로 일상생활 및 직업 생활에서 업무를 수행하는 데 필요한 능력을 기르는 데 목적을 두고 있는 진로 선택 과목임. 이 과목은 주로 취업과 관련하여 업무 수행을 위해 말이나 글, 자료 등을 정확하게 이해하고 맥락에 따라 자신의 의사를 효과적으로 전달하는 방법을 기르는 데 중점을 두고 있음.",
                contents: ["직무 어휘와 어법 (어휘 선택, 문장 작성)", "정보의 해석과 조직 (정보 해석, 정보 조직)", "설득과 협력적 문제 해결 (설득, 의사 결정, 문제 해결, 갈등 관리)", "대인 관계와 의사소통 (대인 관계, 언어 예절)", "문화와 교양 (의사소통 문화, 자아 성찰, 교양 함양)"],
                csat: "수능 출제 과목 아님",
                depts: "국어국문학과, 국어교육학과, 신문방송학과, 미디어커뮤니케이션학과, 언어학과, 문헌정보학과, 행정학과, 관광경영과, 비서행정과 등",
                jobs: "언론인, 중등교사, 작가, 언어학연구원, 일반 공무원, 법률 사무원, 방송작가, 출판물편집자, 카피라이터, 평론가, 프로듀서, 통역사 등",
                etc: "국어'의 학습 내용을 바탕으로 보다 실용적인 국어 생활의 맥락을 주된 내용으로 하고 있으므로 '국어'를 배운 후 학습하는 것을 권장함."
            }
        ];

        const searchInput = document.getElementById('searchInput');
        const autocompleteList = document.getElementById('autocompleteList');

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode-major').classList.toggle('active', mode === 'major');
            document.getElementById('mode-subject').classList.toggle('active', mode === 'subject');
            searchInput.value = '';
            autocompleteList.innerHTML = '';
            autocompleteList.classList.remove('show');
            document.getElementById('subject-results').classList.remove('active');
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('search-view').classList.add('active');
            document.getElementById('searchInput').placeholder = mode === 'major'
                ? '학과명을 입력하세요 (예: 기계, 컴퓨터)'
                : '과목명 / 계열 / 관련학과를 입력하세요 (예: 물리학, 화학, 기계공학과)';
            document.getElementById('search-title').innerText = mode === 'major' ? '선택과목 & 학과 정보 검색' : '선택과목 정보 검색';
            renderQuickTags();
        }

        function renderQuickTags() {
            const box = document.getElementById('quick-tags');
            if (currentMode === 'major') {
                box.innerHTML = `
                    <span class="quick-tag" onclick="selectMajor('기계공학과')">#기계공학과</span>
                    <span class="quick-tag" onclick="selectMajor('건축공학과')">#건축공학과</span>
                    <span class="quick-tag" onclick="selectMajor('건축학과')">#건축학과</span>
                    <span class="quick-tag" onclick="selectMajor('컴퓨터공학과')">#컴퓨터공학과</span>
                    <span class="quick-tag" onclick="selectMajor('전자공학과')">#전자공학과</span>
                    <span class="quick-tag" onclick="selectMajor('화학공학과')">#화학공학과</span>
                    <span class="quick-tag" onclick="selectMajor('신소재공학과')">#신소재공학과</span>`;
            } else {
                box.innerHTML = `
                    <span class="quick-tag" onclick="searchSubjectQuick('물리학 I')">#물리학 I</span>
                    <span class="quick-tag" onclick="searchSubjectQuick('화학 I')">#화학 I</span>
                    <span class="quick-tag" onclick="searchSubjectQuick('생명과학 I')">#생명과학 I</span>
                    <span class="quick-tag" onclick="searchSubjectQuick('지구과학 I')">#지구과학 I</span>
                    <span class="quick-tag" onclick="searchSubjectQuick('문학')">#문학</span>
                    <span class="quick-tag" onclick="searchSubjectQuick('독서')">#독서</span>`;
            }
        }

        function searchSubjectQuick(name) {
            searchInput.value = name;
            executeSearch();
        }

        searchInput.addEventListener('input', function() {
            const val = this.value.trim().toLowerCase();
            autocompleteList.innerHTML = '';
            if (!val) { autocompleteList.classList.remove('show'); return; }

            let matches = [];
            if (currentMode === 'major') {
                matches = Object.keys(majorData).filter(key => key.toLowerCase().includes(val)).slice(0, 8);
            } else {
                matches = subjectData
                    .filter(item => item.name.toLowerCase().includes(val) || item.group.toLowerCase().includes(val) || item.depts.toLowerCase().includes(val))
                    .map(item => item.name)
                    .filter((name, idx, arr) => arr.indexOf(name) === idx)
                    .slice(0, 8);
            }

            if (matches.length) {
                matches.forEach(match => {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.innerHTML = `<span>${match}</span><span style="font-size:12px; color:var(--text-muted)">이동 →</span>`;
                    item.onclick = () => {
                        searchInput.value = match;
                        executeSearch();
                        autocompleteList.classList.remove('show');
                    };
                    autocompleteList.appendChild(item);
                });
                autocompleteList.classList.add('show');
            } else {
                autocompleteList.classList.remove('show');
            }
        });

        function executeSearch() {
            const val = searchInput.value.trim();
            if (!val) { alert(currentMode === 'major' ? '학과명을 입력하세요.' : '과목명 또는 관련 검색어를 입력하세요.'); return; }
            autocompleteList.classList.remove('show');

            if (currentMode === 'major') {
                const found = Object.keys(majorData).find(key => key.includes(val));
                if (found) selectMajor(found);
                else alert("검색 결과가 없습니다. '기계', '건축', '컴퓨터', '전자', '화학', '신소재' 등으로 검색해 보세요.");
            } else {
                showSubjectResults(val);
            }
        }

        function showSubjectResults(query) {
            const q = query.toLowerCase();
            const matches = subjectData.filter(item =>
                item.name.toLowerCase().includes(q) ||
                item.group.toLowerCase().includes(q) ||
                item.depts.toLowerCase().includes(q) ||
                item.jobs.toLowerCase().includes(q)
            );

            document.getElementById('search-view').classList.remove('active');
            document.getElementById('detail-view').classList.remove('active');
            const resultView = document.getElementById('subject-results');
            resultView.classList.add('active');
            document.getElementById('subject-result-note').innerText = matches.length
                ? `'${query}' 검색 결과 ${matches.length}개`
                : `'${query}'에 대한 검색 결과가 없습니다.`;

            const list = document.getElementById('subject-result-list');
            if (!matches.length) {
                list.innerHTML = `<div class="subject-result-card"><div style="padding:40px;text-align:center;color:var(--text-muted);">검색어를 다시 입력해 주세요.</div></div>`;
                return;
            }

            list.innerHTML = matches.map(subject => {
                const contentList = subject.contents.map(c => `<li>${c}</li>`).join('');
                return `
                    <div class="subject-result-card">
                        <div class="subject-result-title">
                            <div class="group">${subject.group} · ${subject.type}</div>
                            <h2>${subject.name}</h2>
                        </div>
                        <table class="subject-table-full">
                            <tr><th>교과설명</th><td>${subject.desc}</td></tr>
                            <tr><th>내용 체계</th><td><ul>${contentList}</ul></td></tr>
                            <tr><th>수능 출제 여부</th><td>${subject.csat}</td></tr>
                            <tr><th>관련학과</th><td>${subject.depts}</td></tr>
                            <tr><th>관련직업</th><td>${subject.jobs}</td></tr>
                            <tr><th>기타정보</th><td>${subject.etc}</td></tr>
                        </table>
                    </div>`;
            }).join('');
        }

        function selectMajor(majorName) {
            const data = majorData[majorName];
            if (!data) return;
            document.getElementById('majorTitle').innerText = data.title;
            document.getElementById('majorDesc').innerText = data.desc;
            document.getElementById('majorElectives').innerHTML = data.electives.map(item => `
                <div class="elective-box">
                    <span class="elective-badge">${item.type}</span>
                    <div class="elective-text">${item.subjects}</div>
                </div>`).join('');
            document.getElementById('majorJobs').innerHTML = data.jobs.map(job => `<li>${job}</li>`).join('');
            document.getElementById('basicSubjects').innerText = data.basicSubjects;
            document.getElementById('advancedSubjects').innerText = data.advancedSubjects;
            document.getElementById('majorCerts').innerHTML = data.certs.map(cert => `<span class="chip">${cert}</span>`).join('');
            document.getElementById('majorBooks').innerHTML = data.books.map(book => `<span class="chip">📘 ${book}</span>`).join('');
            document.getElementById('majorUnivs').innerText = data.univs;
            document.getElementById('majorTips').innerHTML = data.tips.map(tip => `<li>${tip}</li>`).join('');
            document.getElementById('subject-results').classList.remove('active');
            document.getElementById('search-view').classList.remove('active');
            document.getElementById('detail-view').classList.add('active');
            window.scrollTo(0, 0);
        }

        function showSearch() {
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('subject-results').classList.remove('active');
            document.getElementById('search-view').classList.add('active');
            searchInput.value = '';
            autocompleteList.classList.remove('show');
            document.getElementById('subject-result-list').innerHTML = '';
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box-wrapper')) autocompleteList.classList.remove('show');
        });

        renderQuickTags();
    </script>
</body>
</html>
